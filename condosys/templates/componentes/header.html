{%load static %}
<header class="app-header">
  <h1 class="header-title">{{nombre_modulo}}</h1>

  <div class="header-right">
    <div class="search-container">
  
      <input
        type="text"
        class="search-input"
        placeholder="Buscar apartamento, residente..."
      />
    </div>

    <button class="btn-nuevo">+ Nuevo</button>

    <button class="notification-btn" aria-label="Notificaciones">
      <span class="notification-badge"></span>
    </button>

    <img
      src=""
      alt="Foto del usuario"
      class="user-avatar"
    />
  </div>
</header>
