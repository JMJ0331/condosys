{% load static %}
<aside>

  <div class="cont-info">

    <div class="app-log">
      <div class="container-img">
        <img class="img-app" src="{% static "images/logo_del_proyecto.svg" %}" alt="home" />
      </div>

      <div class="container-info">
        <h1 class="nombre-app">Condosys</h1>
      </div>
    </div>

    <div class="aside-options">

      <div class="container-links">
        <a
          class="opt-modulo{% if request.resolver_match.url_name == 'inicio' %} active{% endif %}"
          href="{% url 'inicio' %}"

        >
        <img src="{% static 'images/icons/blancos/Container_white.svg' %}" alt="home-icon" />

          <h4>Inicio</h4>
        </a>

        <a
          class="opt-modulo{% if request.resolver_match.url_name == 'departamentos_index' %} active{% endif %}"
          href="{% url 'departamentos_index' %}"
        >

        <img src="{% static 'images/icons/blancos/city_white.svg' %}" alt="city-icon" />
          <h4>Departamentos</h4>
        </a>

        <a
          class="opt-modulo{% if request.resolver_match.url_name == 'residentes_index' %} active{% endif %}"
          href="{% url 'residentes_index' %}"
        >

        <img src="{% static 'images/icons/blancos/group_white.svg' %}" alt="group-icon" />
          <h4>Residentes</h4>
        </a>

        <a
          class="opt-modulo{% if request.resolver_match.url_name == 'propietarios_index' %} active{% endif %}"
          href="{% url 'propietarios_index' %}"
        >

        <img src="{% static 'images/icons/blancos/home-user_white.svg' %}" alt="propietario-icon"/>
          <h4>Propietarios</h4>
        </a>

        <a
          class="opt-modulo{% if request.resolver_match.url_name == 'pagos_index' %} active{% endif %}"
          href="{% url 'pagos_index' %}"
        >

        <img src="{% static 'images/icons/blancos/lot-of-cash_white.svg' %}" alt="waallet-icon" />
          <h4>Pagos</h4>
        </a>


        <a
          class="opt-modulo{% if request.resolver_match.url_name == 'mantenimientos_index' %} active{% endif %}"
          href="{% url 'mantenimientos_index' %}"
        >

          <img src="{% static 'images/icons/blancos/historic-shield-alt_white.svg' %}" alt="settings-icon" />
          <h4>Mantenimientos</h4>
        </a>

        <a
          class="opt-modulo{% if request.resolver_match.url_name == 'incidencias_index' %} active{% endif %}"
          href="{% url 'incidencias_index' %}"
        >

        <img src="{% static 'images/icons/blancos/warning-triangle_white.svg' %}" alt="message-icon"/>
          <h4>Incidencias</h4>
        </a>

        <a
          class="opt-modulo{% if request.resolver_match.url_name == 'visitantes_index' %} active{% endif %}"
          href="{% url 'visitantes_index' %}"
        >

        <img src="{% static 'images/icons/blancos/community_white.svg' %}" alt="community-icon"/>
          <h4>Visitantes</h4>
        </a>

        <a
          class="opt-modulo{% if request.resolver_match.url_name == 'reservas_index' %} active{% endif %}"
          href="{% url 'reservas_index' %}"
        >

        <img src="{% static 'images/icons/blancos/leaf_white.svg' %}" alt="neigh-icon"/>
          <h4>Areas Comunes</h4>
        </a>

        <a
          class="opt-modulo{% if request.resolver_match.url_name == 'comunicados_index' %} active{% endif %}"
          href="{% url 'comunicados_index' %}"
        >

        <img src="{% static 'images/icons/blancos/voice_white.svg' %}" alt="chat-icon"/>
          <h4>Comunicados</h4>
        </a>

      

      </div>

    </div>


  </div>
  

  <div class="container-links">

    <span class="otras-opciones" role="button">
      <img src="{% static "images/icons/log-out.svg" %}" alt="config">
      Cerrar Sesión
    </span>
  </div>


</aside>
