<div class="panel-login">
  <div class="lado-izq">
    <div class="logo">
      <img src="" alt="aka" class="img-logo" />
      <h1 class="nombre-app">CONDOSYS</h1>
    </div>
  </div>
  <div class="lado-der">
    <h2 class="titulo">Iniciar sesión</h2>

    <form action="" method="post" class="form">
      <div class="inputs">
        <div class="container-input">
          <input
            type="email"
            name="userEmail"
            class="input"
            placeholder="Email"
            required
          />
        </div>

        <div class="container-input">
          <input
            type="password"
            name="userPassword"
            class="input"
            placeholder="Contraseña"
            required
          />
          <a href="" class="text-restrablecer">¿Se te ha olvidado la clave?</a>
        </div>
      </div>

      <div class="container-btn">
        <button type="submit" class="btn-enviar">Acceder</button>
      </div>
    </form>
  </div>
</div>
