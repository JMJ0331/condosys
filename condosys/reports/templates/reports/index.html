{% block mini-cards %}{% endblock %}

{% block contenido %}

<div class="container-main-side2">
  <form method="post" action="{% url 'crear_bitacora' %}">
    {% csrf_token %}
    {{ form_audit_log.as_p }}
    <div class="pie-formulario">
      <button type="submit">Guardar</button>

  <hr />

    {{ form_audit_log_detail.as_p }}

      <button type="submit">Guardar</button>
    </div>
  </form>
</div>
{% endblock %}
